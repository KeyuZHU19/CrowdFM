checkpoint_path: log/predictive_cfm/10000.pt
output_path: log/predictive_audit.json
base_seed: 42000

dim: &dim 32
device: &device cuda:0

model:
  dim: *dim
  device: *device
  layer: 10
  head: 4
  dropout: 0.1

predictive_audit:
  audit_task_fraction: 1.0
  context_fraction: 0.5
  min_context_workers: 1
  min_audit_workers: 2
  min_worker_context_edges: 1
  min_pair_count: 1
  probability_clip: 0.0001
  variance_ridge: 0.00000001
  num_bootstrap: 199
  alpha: 0.05
  require_trained_response_head: true

path:
  data: data
  src: src
  log: log
