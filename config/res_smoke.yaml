mode: residual
use_mechanism: true
lr: 0.001
weight_decay: 0.00001
batch_size: 1
gradient_accumulation_steps: 4
gradient_clip: 5.0
epochs: 12
save_interval: 12
num_workers: 0
backbone_checkpoint_path: checkpoint.pt
output_dir: log/res_smoke
truth_w: 1.0
resp_w: 1.0
anchor_w: 0.1
mkl_w: 0.001
inner_lr: 0.1
device: &device cpu
model: {dim: 32, device: *device, layer: 10, head: 4, dropout: 0.0, mechanism_latent_dim: 16, num_mechanism_primitives: 8}
simulator: {dim: 32, num_worker_range: [20, 60], num_task_range: [50, 100], num_option_range: [2, 6], num_answer_each_task_range: [3, 6], min_answers_per_task: 3, mechanism_families: [irt, class_bias, coalition, assignment_bias, mixed]}
path: {data: data, src: src, log: log}
