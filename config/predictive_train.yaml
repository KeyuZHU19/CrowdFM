lr: 0.001
weight_decay: 0.00001
batch_size: 32
gradient_accumulation_steps: 1
epochs: 10000
save_interval: 100
num_workers: 0

backbone_checkpoint_path: checkpoint.pt
freeze_backbone: true
output_dir: log/predictive_cfm

dim: &dim 32
device: &device cuda:0

model:
  dim: *dim
  device: *device
  layer: 10
  head: 4
  dropout: 0.1

simulator:
  dim: *dim
  num_worker_range: [20, 100]
  num_task_range: [100, 300]
  num_option_range: [2, 20]
  num_answer_each_task_range: [3, 10]

predictive_training:
  audit_task_fraction: 1.0
  context_fraction: 0.5
  min_context_workers: 1
  min_audit_workers: 2
  min_worker_context_edges: 0
  truth_loss_weight: 0.0
  annotation_loss_weight: 1.0

path:
  data: data
  src: src
  log: log
