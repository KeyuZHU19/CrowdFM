lr: 0.001
weight_decay: 0.0
batch_size: 1
gradient_accumulation_steps: 1
gradient_clip: 5.0
epochs: 2
save_interval: 1
num_workers: 0

backbone_checkpoint_path: null
freeze_backbone: false
output_dir: log/crowdsi_smoke

dim: &dim 8
device: &device cpu

model:
  dim: *dim
  device: *device
  layer: 1
  head: 1
  dropout: 0.0
  mechanism_latent_dim: 4
  num_mechanism_primitives: 4

simulator:
  dim: *dim
  num_worker_range: [6, 8]
  num_task_range: [8, 12]
  num_option_range: [2, 4]
  num_answer_each_task_range: [3, 5]
  mechanism_families:
    - irt
    - class_bias
    - coalition
    - assignment_bias
    - mixed

crowdsi_training:
  audit_task_fraction: 1.0
  context_fraction: 0.5
  min_context_workers: 1
  min_audit_workers: 2
  min_worker_context_edges: 0
  truth_loss_weight: 1.0
  annotation_loss_weight: 1.0
  assignment_loss_weight: 0.25
  mechanism_kl_weight: 0.001
  consistency_loss_weight: 0.1
  assignment_negative_ratio: 0.5

path:
  data: data
  src: src
  log: log
