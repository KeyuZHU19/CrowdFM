dim: &dim 32
device: &device cuda:0
checkpoint_path: checkpoint.pt
output_path: log/cbr_calibration_smoke_refit.json

model:
  dim: *dim
  device: *device
  layer: 10
  head: 4
  dropout: 0.1

cbr:
  audit_fraction: 0.5
  context_fraction: 0.5
  min_context_workers: 1
  min_audit_workers: 2
  prior_strength: 1.0
  min_pair_count: 1
  probability_clip: 0.0001
  variance_ridge: 0.00000001
  num_bootstrap: 99
  alpha: 0.05
  refit_confusion_bootstrap: true

calibration:
  num_worlds: 20
  base_seed: 42000
  variants:
    - oracle_q_oracle_p
    - model_q_oracle_p
    - oracle_q_estimated_p
    - model_q_estimated_p
  configurations:
    - name: small_binary
      num_worker: 20
      num_task: 200
      num_option: 2
      labels_per_task: 5
      dim: *dim
    - name: medium_multiclass
      num_worker: 50
      num_task: 500
      num_option: 5
      labels_per_task: 5
      dim: *dim
    - name: large_multiclass
      num_worker: 100
      num_task: 1000
      num_option: 10
      labels_per_task: 10
      dim: *dim
    - name: sparse_imbalanced
      num_worker: 50
      num_task: 500
      num_option: 5
      labels_per_task: 3
      class_imbalance: 1.0
      dim: *dim
