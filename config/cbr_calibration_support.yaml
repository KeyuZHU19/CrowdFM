dim: &dim 32
device: &device cuda:0
checkpoint_path: checkpoint.pt
output_path: log/cbr_calibration_support.json

model:
  dim: *dim
  device: *device
  layer: 10
  head: 4
  dropout: 0.1

cbr:
  audit_fraction: 0.5
  context_fraction: 0.5
  min_context_workers: 1
  min_audit_workers: 2
  prior_strength: 10.0
  confusion_prior_mode: global
  min_pair_count: 1
  probability_clip: 0.0001
  variance_ridge: 0.00000001
  num_bootstrap: 49
  alpha: 0.05
  refit_confusion_bootstrap: false
  posterior_predictive_confusion_bootstrap: true

calibration:
  num_worlds: 5
  base_seed: 73000
  variants:
    - oracle_q_oracle_p
    - oracle_q_estimated_p
  configurations:
    - name: k5_support_5
      num_worker: 50
      num_task: 500
      num_option: 5
      labels_per_task: 5
      dim: *dim
    - name: k5_support_20
      num_worker: 50
      num_task: 2000
      num_option: 5
      labels_per_task: 5
      dim: *dim
    - name: k5_support_50
      num_worker: 50
      num_task: 5000
      num_option: 5
      labels_per_task: 5
      dim: *dim
    - name: k10_support_5
      num_worker: 100
      num_task: 1000
      num_option: 10
      labels_per_task: 10
      dim: *dim
    - name: k10_support_20
      num_worker: 100
      num_task: 4000
      num_option: 10
      labels_per_task: 10
      dim: *dim
