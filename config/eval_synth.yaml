checkpoint_path: runs/p1_full_s42/10000.pt
output_path: runs/p1_full_s42/eval_insprior.json
base_seed: 90000
num_worlds: 200
device: cpu
dim: &dim 32
model:
  dim: *dim
  device: cpu
  layer: 10
  head: 4
  dropout: 0.0
  mechanism_latent_dim: 16
  num_mechanism_primitives: 8
simulator:
  dim: *dim
  num_worker_range: [20, 100]
  num_task_range: [100, 300]
  num_option_range: [2, 20]
  num_answer_each_task_range: [3, 10]
  min_answers_per_task: 3
  mechanism_families: [irt, class_bias, coalition, assignment_bias, mixed]
path:
  data: data
  src: src
  log: log
